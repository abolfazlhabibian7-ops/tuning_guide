</style></head><body>

(()=>{

/* ---------- text (en / fa; other site languages fall back to en) ---------- */

let G=null;try{G=JSON.parse(localStorage.getItem("raceGhost")||"null")}catch(e){}
const NM=["Kaveh","Rio","Max","Sara","Dima","Luca","Aiko"];
const mus=new Audio();mus.loop=true;let MN="",MV=+(localStorage.getItem("raceMV")||60);mus.volume=MV/100;
let L=localStorage.getItem("lang");L=L==="fa"?"fa":"en";
const t=k=>(T[L]&&T[L][k])||T.en[k];
/* ---------- cars: name, drive, turbo, hp, kg, grip, brake, CdA, redline ---------- */
const CARS=[["Peugeot 206","f",0,100,1000,.95,.95,.62,6200],["Toyota GT86","r",0,200,1250,1.05,1.05,.64,7400],["Honda Civic Type R","f",1,320,1400,1.08,1.12,.68,6800],["Subaru WRX STI","a",1,300,1530,1.05,1.08,.7,6700],["BMW M3 E46","r",0,340,1500,1.05,1.08,.66,7900],["Ford Mustang GT","r",0,450,1700,1.05,1.08,.7,7000],["Nissan GT-R","a",1,570,1750,1.15,1.2,.68,7000]];
const COL=["#ff2e93","#00e5ff","#8a5cff","#ffd166","#4dffa6","#ff7a2f","#e8e8f2"];
/* upgrades in bot priority order: id, en, fa, effect (h=power x, g=grip, tr=traction, b=brake, m=kg, cd, cl=downforce, t=turbo only) */
const UP=[["tires","Performance tires","لاستیک اسپرت",{g:.12}],["ecu","ECU remap","ریمپ ECU",{h:.12}],["brakes","Brake upgrade","ارتقای ترمز",{b:.25}],["intake","Cold air intake","ورودی هوای سرد",{h:.03}],["exhaust","Cat-back exhaust","اگزوز کت‌بک",{h:.03}],["susp","Coilovers","کویل‌اور",{g:.05}],["lsd","Limited-slip diff","دیفرانسیل LSD",{tr:.08}],["wheels","Light wheels","رینگ سبک",{m:-14}],["boost","Downpipe + intercooler","داون‌پایپ + اینترکولر",{h:.12,t:1}],["aero","Aero kit","کیت ایرو",{cl:1,cd:.1}],["nitro","Nitrous (Space / N)","نیترو (Space / N)",{}]];
const avail=ci=>UP.filter(u=>!u[3].t||CARS[ci][2]);
const PR={tires:180,ecu:300,brakes:160,intake:80,exhaust:120,susp:200,lsd:220,wheels:260,boost:350,aero:240,nitro:400};const price=(ci,id)=>Math.round(PR[id]*Math.sqrt(CARS[ci][3]/200)/10)*10;
function stats(ci,ups){const c=CARS[ci];let hp=c[3],m=c[4],g=c[5],b=c[6],cd=c[7],tr=c[5]*.95,cl=0;
 for(const u of UP){if(!ups.has(u[0])||(u[3].t&&!c[2]))continue;const e=u[3];hp*=1+(e.h||0);m+=e.m||0;g+=e.g||0;tr+=(e.g||0)+(e.tr||0);b+=e.b||0;cd+=e.cd||0;cl+=e.cl||0}
 const s={hp,m,g,tr,b,cd,cl,drive:c[1],turbo:c[2],red:c[8],exh:ups.has("exhaust")};
 s.P=hp*745.7*.65;let lo=20,hi=130;for(let i=0;i<40;i++){const v=(lo+hi)/2;(s.P-(.6*cd*v**3+.147*m*v)>0)?lo=v:hi=v}
 s.nitro=ups.has("nitro");s.vt=lo;s.tops=[.3,.45,.6,.74,.88,1].map(x=>x*lo*1.06*(s.nitro?1.12:1));
 s.pi=Math.round(hp/m*1300+(g-.8)*300+(b-.8)*100+cl*20+(s.nitro?25:0));return s}
/* ---------- track (closed Catmull-Rom loop, resampled every ~3 m) ---------- */
const PTS=[[0,0],[250,-20],[480,40],[620,180],[560,330],[430,400],[330,340],[360,250],[250,290],[190,360],[120,460],[-80,470],[-230,380],[-250,200],[-150,80]];
const cr=(a,b,c,d,u)=>[0,1].map(i=>.5*(2*b[i]+(-a[i]+c[i])*u+(2*a[i]-5*b[i]+4*c[i]-d[i])*u*u+(-a[i]+3*b[i]-3*c[i]+d[i])*u*u*u));
const raw=[],n0=PTS.length;for(let i=0;i<n0;i++)for(let j=0;j<40;j++)raw.push(cr(PTS[(i+n0-1)%n0],PTS[i],PTS[(i+1)%n0],PTS[(i+2)%n0],j/40));
const cum=[0];for(let i=1;i<=raw.length;i++){const a=raw[i-1],b=raw[i%raw.length];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
const LEN=cum[raw.length],N=Math.round(LEN/3),DS=LEN/N,X=[],Y=[];
for(let i=0,j=0;i<N;i++){const s=i*DS;while(cum[j+1]<s)j++;const f=(s-cum[j])/(cum[j+1]-cum[j]),a=raw[j],b=raw[(j+1)%raw.length];X.push(a[0]+(b[0]-a[0])*f);Y.push(a[1]+(b[1]-a[1])*f)}
const TH=X.map((_,i)=>Math.atan2(Y[(i+1)%N]-Y[(i+N-1)%N],X[(i+1)%N]-X[(i+N-1)%N]));
const K0=TH.map((_,i)=>nd(TH[(i+1)%N]-TH[(i+N-1)%N])/(2*DS)),K=K0.map((_,i)=>{let s=0;for(let j=-4;j<=4;j++)s+=K0[(i+j+N)%N];return clamp(s/9,-.06,.06)});

const idx=s=>{const i=((s/DS)%N+N)%N,a=i|0;return[a,(a+1)%N,i-a]};
const curv=s=>{const[a,b,f]=idx(s);return K[a]+(K[b]-K[a])*f};
const P=s=>{const[a,b,f]=idx(s);return[X[a]+(X[b]-X[a])*f,Y[a]+(Y[b]-Y[a])*f,TH[a]+nd(TH[b]-TH[a])*f]};
const wrap=x=>((x+LEN/2)%LEN+LEN)%LEN-LEN/2;
const road=new Path2D();X.forEach((x,i)=>i?road.lineTo(x,Y[i]):road.moveTo(x,Y[i]));road.closePath();
/* ---------- physics (same for player and bots) ---------- */
const LF={a:1,r:.68,f:.58},SL={f:1.15,r:.95,a:.8};
function mk(ci,ups,o){return Object.assign({ci,s:stats(ci,ups),p:0,d:0,v:0,gr:0,sh:0,th:0,br:0,sr:0,rn:.28,slip:0,fin:null,mi:0,lane:0,skill:1,nos:100,nx:0,bst:0,want:null,man:0,dr:0,lim:0,on:0,wear:0,cs:0},o)}
function step(c,dt){const s=c.s;let v=c.v;
 const raw=v/s.tops[c.gr];if(c.sh>0)c.sh-=dt;
 if(c.man){if(c.want!==null&&c.want!==c.gr&&c.sh<=0){if(c.want>c.gr&&raw>.88&&raw<1){c.bst=.4;c.nos=Math.min(100,c.nos+10)}c.gr=c.want;c.sh=.15}c.want=null}
 else if(c.sh<=0){if(raw>.97&&c.gr<5){c.gr++;c.sh=.28}else if(raw<.45&&c.gr>0)c.gr--}
 const r2=v/s.tops[c.gr],rn=clamp(r2,.28,1);c.rn=rn;c.lim=r2>=1&&c.sh<=0?1:0;
 const cv=s.turbo?.55+.45*sm((rn-.2)/.35):.8+.2*Math.sin(rn*3);
 const df=.6*s.cl*v*v,W=s.m*9.81,gf=1-.25*c.wear,ft=s.tr*gf*W*LF[s.drive]+df*.4;
 let fp=c.sh>0||c.lim?0:c.th*s.P*cv/Math.max(v,4);
 if(c.man&&r2<.3&&c.gr>0)fp*=.45;
 if(c.bst>0){c.bst-=dt;fp*=1.08}
 const nx=c.nx&&c.nos>0&&s.nitro;
 if(nx){fp*=1.4;c.nos=Math.max(0,c.nos-28*dt)}else if(c.th>.9&&c.slip<.1)c.nos=Math.min(100,c.nos+3*dt);
 c.on=nx?1:0;
 c.spin=fp>ft;const fd=c.spin?ft*.9:fp,fb=c.br*Math.min(s.b,s.g*1.05+df/W)*W;
 v=Math.max(0,v+(fd-.6*s.cd*v*v*(c.dr?.72:1)-.147*s.m-(1-c.th)*s.m*(.4+rn)*(c.lim?2.5:1)-fb)/s.m*dt);
 const k=curv(c.p),lim=(s.g*gf+df/W)*9.81,use=v*v*Math.abs(k)/lim,ex=Math.max(0,v*v*Math.abs(k)-lim);c.slip=ex;c.wear=Math.min(1,c.wear+dt*(.0016+ex*.003+(c.spin?.01:0)+(c.on?.004:0)));c.cs=use>.8&&use<=1&&Math.abs(c.d)<HW?1:ex>.3&&ex<3?2:0;if(c.cs)c.nos=Math.min(100,c.nos+(c.cs===1?12:18)*dt);
 if(ex>0){c.d-=Math.sign(k)*ex*.35*SL[s.drive]*dt;v=Math.max(0,v-ex*.5*dt)}
 c.d+=c.sr*7*(s.g/1.05)*Math.max(.35,1.25-v/90)*dt;
 if(Math.abs(c.d)>HW&&v>15)v-=10*dt;
 if(Math.abs(c.d)>HW+9){c.d=Math.sign(c.d)*(HW+9);v*=.98}
 c.v=v;c.p+=v*dt/Math.max(.3,1-k*c.d)}
function ai(c,all,dt){const s=c.s,ag=s.g*(1-.25*c.wear)*9.81*.9*c.skill,vb=Math.min(s.b,s.g*1.05)*9.81*.85;let tv=130;
 for(let x=0;x<=220;x+=11){const vc=Math.sqrt(ag/(Math.abs(curv(c.p+x))+1e-4));tv=Math.min(tv,Math.sqrt(vc*vc+2*vb*x))}
 if(c.mi>0){tv*=.85;c.mi-=dt}else if(Math.random()<dt*.05*(1-c.skill+.03)*(c.sty===0?2.5:1))c.mi=.8;
 c.nx=c.s.nitro&&c.nos>25&&tv>c.v+8&&Math.abs(curv(c.p+30))<.004?1:0;
 if(c.v<tv-1){c.th=1;c.br=0}else if(c.v>tv+1){c.th=0;c.br=Math.min(1,(c.v-tv)/8)}else{c.th=.35;c.br=0}
 let dd=clamp(curv(c.p+30)*320,-5.5,5.5)+c.lane*(1-Math.min(1,Math.abs(curv(c.p+30))*60));
 for(const o of all)if(o!==c){const q=wrap(o.p-c.p);if(q>0&&q<26&&Math.abs(o.d-c.d)<2.6)dd=c.d>=o.d?Math.min(HW-2,o.d+3):Math.max(-HW+2,o.d-3)}

/* ---------- state + menu ---------- */
let st={ci:1,ups:[],lv:1,cnt:4,laps:3,tx:0,money:400,own:{},unl:0,free:0};try{Object.assign(st,JSON.parse(localStorage.getItem("raceSave")||"{}"))}catch(e){}st.ups=st.ups.filter(u=>st.free||(st.own[st.ci]||[]).includes(u));

 $("#menu").innerHTML=`<h2>${t("car")}</h2><div class="g">${CARS.map((c,i)=>`<button class="b ${i==st.ci?"on":""}" data-car="${i}">${c[0]}<small>${c[3]} hp · ${c[4]} kg · ${c[1].toUpperCase()}${c[2]?" · turbo":""}</small></button>`).join("")}</div>

 <div class="row" style="margin:.8rem 0"><button class="go s" data-reset>${t("reset")}</button><button class="go s" data-max>${t("max")}</button><b style="margin-inline-start:auto">${t("pi")} ${s.pi}</b></div>
 ${nm.map((n,i)=>`<div>${n}</div><div class="bar"><i style="width:${clamp(b[i],0,1)*100}%"></i><u style="inset-inline-start:${clamp(a[i],0,1)*100}%"></u></div>`).join("")}

 else if(d.up){const own=st.own[st.ci]||(st.own[st.ci]=[]),pr=price(st.ci,d.up);if(st.ups.includes(d.up))st.ups=st.ups.filter(x=>x!==d.up);else if(st.free||own.includes(d.up))st.ups=[...st.ups,d.up];else if(st.money>=pr){st.money-=pr;own.push(d.up);st.ups=[...st.ups,d.up]}}

 cx.lineJoin="round";cx.strokeStyle="rgba(0,229,255,.14)";cx.lineWidth=HW*2+7;cx.stroke(road);
 cx.strokeStyle="#00e5ff";cx.lineWidth=HW*2+1.6;cx.stroke(road);cx.strokeStyle="#0d0d1a";cx.lineWidth=HW*2;cx.stroke(road);
 cx.strokeStyle="rgba(255,255,255,.35)";cx.lineWidth=.5;cx.setLineDash([6,10]);cx.stroke(road);cx.setLineDash([]);
 const[sx,sy,sh]=P(0);cx.save();cx.translate(sx,sy);cx.rotate(sh);cx.fillStyle="#fff";for(let i=0;i<9;i++)for(let j=0;j<2;j++)if((i+j)%2==0)cx.fillRect(j*1.6-1.6,-HW+i*2,1.6,2);cx.restore();

 for(const c of R.cars){const[x,y,h]=pos(c),yaw=h+Math.atan2(c.sr*3,Math.max(c.v,5))*.8;cx.save();cx.translate(x,y);cx.rotate(yaw);cx.scale(1.3,1.3);
